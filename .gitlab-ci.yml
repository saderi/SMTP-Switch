# GitLab CI: run tests, then build + push the Docker image to the project's
# GitLab Container Registry ($CI_REGISTRY_IMAGE).

stages: [test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.pip-cache: &pip-cache
  key:
    files: [pyproject.toml]
  paths:
    - .cache/pip

test:
  stage: test
  tags:
    - docker_runner
  image: "python:3.12-slim"
  cache: *pip-cache
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - ruff check .
    - mypy smtp_switch
    - pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build-image:
  stage: build
  tags:
    - docker_runner
  image: docker:27-cli
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --cache-from "$CI_REGISTRY_IMAGE:latest"
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --tag "$CI_REGISTRY_IMAGE:latest" .
    - docker run -d --name sw -p 8080:8080
      -e SMTP_SWITCH_WEB__SESSION_SECRET=ci-smoke-secret
      "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 5 && curl -s http://127.0.0.1:8080/healthz | grep -q "ok"
    - docker rm -f sw
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
