<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · smtp-switch</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">smtp-switch</a>
  <nav>
    <a href="/" class="{{ 'active' if title == 'Overview' }}">Overview</a>
    <a href="/messages" class="{{ 'active' if title == 'Messages' }}">Messages</a>
    <a href="/providers" class="{{ 'active' if title == 'Providers' }}">Providers</a>
    <a href="/accounts" class="{{ 'active' if title == 'Accounts' }}">Accounts</a>
    <a href="/metrics" target="_blank" rel="noopener">Metrics</a>
  </nav>
  <span class="spacer"></span>
  <span class="who">{{ user }}</span>
  <button class="link" onclick="logout()">Sign out</button>
</header>
{% endif %}
<main>
  <h1>{{ title }}</h1>
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
